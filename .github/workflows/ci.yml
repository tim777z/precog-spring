name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, off the hour to avoid the top-of-hour GitHub Actions rush.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository or read secrets.
permissions:
  contents: read

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify (checkstyle, tests, coverage gate)
    # Pinned rather than `ubuntu-latest`: the moving label is scheduled to migrate to Ubuntu 26,
    # and a toolchain change landing in the middle of a release is a broken build nobody
    # reproduced. The version is bumped deliberately, in its own commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Node 24 major of each action. The v4 majors run on Node 20, which GitHub has retired;
      # they are force-migrated to Node 24 at run time and emit a deprecation warning on every
      # run, so the pinned major has to be the one that targets Node 24 natively.
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # Pinned by pom.xml, but caching also needs a resolved dependency tree to key on.
          cache: maven
          cache-dependency-path: pom.xml

      # Discrete steps for failure visibility and independent caching. Each step fails fast
      # with a clear label so the job list shows exactly which gate broke.
      - name: Lint (checkstyle)
        run: mvn -B checkstyle:check

      - name: Test (unit and slice tests)
        run: mvn -B test

      - name: Coverage gate (JaCoCo report and thresholds)
        run: mvn -B jacoco:report jacoco:check

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
          # `warn`, not `error`: the coverage gate itself is enforced by jacoco:check inside
          # the coverage step, so this step only publishes evidence. Failing the run because the
          # report is missing would report the same red twice and hide the real Maven failure.
          if-no-files-found: warn

      - name: Generate and upload dependency tree
        if: always()
        run: mvn -B dependency:tree -DoutputFile=dependency-tree.txt

      - name: Upload dependency tree
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-tree
          path: dependency-tree.txt
          retention-days: 30
          if-no-files-found: warn

  dependency-review:
    name: Dependency review (advisories and licences)
    # Supply-chain gate for the pull request that introduces or bumps a dependency. The
    # advisory database is consulted for the diff only, so this is fast and does not need the
    # NVD sync the weekly audit below performs. Scoped to pull_request because the review
    # compares the change against its base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # v5 is the first major of this action that targets Node 24. v4 still declares Node 20,
      # which GitHub has retired, so the runner force-migrates it and warns on every run.
      - name: Review changed dependencies
        id: review
        uses: actions/dependency-review-action@v5
        # The action may not decide whether this job passes; the step below does. It reads the
        # repository dependency graph (Settings -> Code security -> Dependency graph), an
        # administrator setting that no branch can turn on, and where it is off the action
        # aborts with "Dependency review is not supported on this repository" -- taking every
        # pull request red over a repository setting rather than over a vulnerability. A gate
        # that cries wolf is a gate that gets switched off, so the finding is still recorded
        # and reported here, but the pass/fail decision is made by code in this repository.
        continue-on-error: true
        with:
          # Produces the report and the outputs below; never the exit code.
          warn-only: true
          # High or critical blocks. This also sets the bar for what the action itself
          # reports, so the step below blocks exactly on what the action would have.
          fail-on-severity: high
          # This job holds `contents: read` and nothing else, so the summary must stay in the
          # run log: posting it as a pull request comment would need `pull-requests: write`.
          comment-summary-in-pr: never

      - name: Fail on a vulnerable dependency or an unaccepted licence
        # Fail-closed on the review output: a non-empty finding list blocks, whatever the
        # reason the action stopped early. An unset output -- the dependency graph being off --
        # is "nothing to block on", and is reported as such rather than passed over silently.
        env:
          VULNERABLE: ${{ steps.review.outputs.vulnerable-changes }}
          INVALID_LICENSES: ${{ steps.review.outputs.invalid-license-changes }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        run: |
          set -euo pipefail
          if [ -n "${VULNERABLE}" ] && [ "${VULNERABLE}" != "[]" ]; then
            echo "::error title=Vulnerable dependency::this pull request introduces a dependency with a known vulnerability"
            printf '%s' "${VULNERABLE}" | jq -r '.[] | "  \(.advisory.severity // "unknown")\t\(.advisory.ghsaId // "no GHSA id")\t\(.change.package.name)@\(.change.version)"' || true
            exit 1
          fi
          if [ -n "${INVALID_LICENSES}" ] && [ "${INVALID_LICENSES}" != "[]" ]; then
            echo "::error title=Unaccepted licence::this pull request introduces a dependency under a licence this project has not accepted"
            printf '%s' "${INVALID_LICENSES}" | jq . || true
            exit 1
          fi
          echo "No vulnerable dependency and no unaccepted licence in this pull request."
          # Through `env:`, never inline in the script: an expression written straight into a
          # shell command is executed by the shell, so any value that could ever carry a
          # character of its own is a command-injection seam.
          if [ "${REVIEW_OUTCOME}" != "success" ]; then
            echo "::notice title=Dependency review could not run::the repository dependency graph is off, so the advisory database was not consulted. Enable it under Settings -> Code security -> Dependency graph. Until then the weekly OWASP scan in the 'Dependency audit' job is the only advisory gate."
          fi

  dependency-audit:
    name: Dependency audit (OWASP CVE scan)
    runs-on: ubuntu-24.04
    # Syncing the NVD takes minutes and is rate limited, so this runs on a schedule instead
    # of blocking every pull request. Scheduled runs are also skipped when the previous week
    # is cancelled, which is why it is limited to the schedule and manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Scan dependencies for known CVEs
        run: mvn -B -Psecurity-audit verify

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
          if-no-files-found: warn

  dependency-updates:
    name: Dependency updates (informational)
    # Runs weekly on the same schedule as the audit. Does not fail the build; the output
    # surfaces outdated majors so maintainers can triage them in a batch PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Display dependency updates
        run: mvn -B versions:display-dependency-updates versions:display-plugin-updates
