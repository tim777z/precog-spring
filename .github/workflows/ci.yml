name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly, off the hour to avoid the top-of-hour GitHub Actions rush.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Least privilege: no job here needs to write to the repository or read secrets.
permissions:
  contents: read

# A newer push to the same branch makes any in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify (checkstyle, tests, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Pinned by pom.xml, but caching also needs a resolved dependency tree to key on.
          cache: maven
          cache-dependency-path: pom.xml

      # `verify` runs the full gate: enforcer (JDK/Maven floor) -> checkstyle -> unit and
      # slice tests -> JaCoCo report and coverage thresholds. Lint is no longer a separate
      # optional step, so style regressions cannot reach main behind a green test run.
      - name: Build and verify
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

  dependency-audit:
    name: Dependency audit (OWASP CVE scan)
    runs-on: ubuntu-latest
    # Syncing the NVD takes minutes and is rate limited, so this runs on a schedule instead
    # of blocking every pull request. Scheduled runs are also skipped when the previous week
    # is cancelled, which is why it is limited to the schedule and manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Scan dependencies for known CVEs
        run: mvn -B -Psecurity-audit verify

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
